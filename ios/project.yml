name: VeloxItalia
options:
  bundleIdPrefix: net.veloxitalia
  deploymentTarget:
    iOS: "17.0"
packages:
  VeloxKit:
    path: VeloxKit
targets:
  VeloxItalia:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources
      - path: App/Resources/seed
        type: folder
        buildPhase: resources
    dependencies:
      - package: VeloxKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Velox Italia
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: >-
          Serve a segnalarti i controlli di velocità pubblicati dalla Polizia
          Stradale lungo il percorso, solo mentre la modalità viaggio è attiva.
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.veloxitalia.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
