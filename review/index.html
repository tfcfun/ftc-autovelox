<!doctype html>
<meta charset="utf-8">
<title>Velox Italia — postazioni fisse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --line: #cbd5e1; --muted: #334155; --accent: #b45309; }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 system-ui, -apple-system, sans-serif; margin: 0;
         display: flex; height: 100vh; color: #0f172a; }
  #panel { width: 430px; min-width: 320px; overflow-y: auto;
           border-right: 1px solid var(--line); background: #f8fafc; }
  #map { flex: 1; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fff;
           position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .lede { font-size: 13px; color: var(--muted); margin: 0; }
  .row { padding: 11px 16px; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
  .row:hover { background: #eef2f7; }
  .row.unplaced { background: #fff7ed; cursor: default; }
  .road { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 99px;
         background: #e2e8f0; color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .tag.extent { background: #fef3c7; color: #92400e; }
  .tag.point { background: #dcfce7; color: #166534; }
</style>

<div id="panel">
  <header>
    <h1>Postazioni fisse — Polizia Stradale</h1>
    <p class="lede">
      Le fonti non pubblicano coordinate. Dove la strada è nota si interpola il
      chilometro; altrove si conosce solo il <strong>tratto</strong> dentro il comune,
      ed è quello che viene disegnato. Nessun punto inventato.
    </p>
  </header>
  <div id="list"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([42.5, 12.5], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

fetch('../data/latest/fixed_cameras.json')
  .then(r => r.json())
  .then(cameras => {
    const list = document.getElementById('list');
    let placed = 0, extents = 0;

    cameras.forEach(camera => {
      const ways = camera.uncertainty_ways || [];
      const hasExtent = ways.length > 0;
      const hasPoint = camera.lat != null && !hasExtent;

      const row = document.createElement('div');
      row.className = 'row' + (!hasExtent && camera.lat == null ? ' unplaced' : '');

      const kind = hasExtent
        ? '<span class="tag extent">tratto</span>'
        : (hasPoint ? '<span class="tag point">punto</span>' : '<span class="tag">non localizzata</span>');

      row.innerHTML =
        `<div class="road">${camera.road_name} · km ${camera.km_raw}${kind}</div>` +
        `<div class="meta">${camera.comune} (${camera.province})` +
        `${camera.direction_raw ? ' · dir. ' + camera.direction_raw : ''}</div>`;

      let layer = null;
      if (hasExtent) {
        extents++;
        // The stretch the camera sits somewhere along — the honest shape.
        layer = L.layerGroup(
          ways.map(line => L.polyline(line.map(p => [p[1], p[0]]), {
            color: '#b45309', weight: 7, opacity: 0.55, lineCap: 'round'
          }))
        ).addTo(map);
      } else if (hasPoint) {
        placed++;
        layer = L.circleMarker([camera.lat, camera.lon], {
          radius: 6, color: '#166534', fillColor: '#22c55e', fillOpacity: 0.9, weight: 2
        }).addTo(map);
      }

      if (layer) {
        const label = `${camera.road_name}<br>km ${camera.km_raw} · ${camera.comune}` +
          (hasExtent ? '<br><em>posizione approssimativa lungo il tratto</em>' : '');
        layer.bindPopup ? layer.bindPopup(label) : layer.eachLayer(l => l.bindPopup(label));
        row.onclick = () => {
          const bounds = hasExtent
            ? L.featureGroup(layer.getLayers()).getBounds()
            : L.latLng(camera.lat, camera.lon).toBounds(1200);
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
          layer.openPopup ? layer.openPopup() : layer.getLayers()[0].openPopup();
        };
      }
      list.appendChild(row);
    });

    document.querySelector('.lede').insertAdjacentHTML('beforeend',
      `<br><strong>${cameras.length}</strong> postazioni · ` +
      `<strong>${extents}</strong> come tratto · <strong>${placed}</strong> come punto`);
  })
  .catch(err => {
    document.getElementById('list').innerHTML =
      `<div class="row unplaced">Dati non caricati: ${err}. ` +
      `Serve un server locale (fetch non funziona da file://).</div>`;
  });
</script>
