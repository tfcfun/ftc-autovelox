name: ingest

on:
  schedule:
    # The Polizia republish the weekly PDFs at a variable time on Monday
    # morning, not at a fixed hour: on 2026-08-17 the 07:57 UTC run still read
    # the previous week, on 2026-08-24 they had turned over by 07:54. Retry
    # across the morning instead of betting on one hour -- until they turn over,
    # data/latest holds an expired programme, and the app (which clamps its date
    # picker to the published validity window) can only offer days up to Sunday.
    - cron: "0 6-16 * * 1"
    - cron: "0 7 * * *"   # daily retry, so a Monday failure does not cost a week
  workflow_dispatch:

permissions:
  contents: write

# Two runs pushing to the same branch would race on the snapshot commit.
# Queue them instead, and never cancel one midway: a half-finished ingest that
# got killed after fetching but before publishing wastes the Overpass budget.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Overpass is slow and rate-limits hard. With the geometry cache committed
    # this job takes minutes; with a cold cache it can take hours, so cap it
    # well below the 6-hour job limit rather than burning a whole runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - run: pip install -e ".[dev]"

      # Tests run BEFORE ingest so a parser regression blocks publication
      # instead of committing bad data.
      - run: pytest -q

      - run: python -m velox.cli ingest --root data

      - name: Commit snapshot
        run: |
          git config user.name "velox-bot"
          git config user.email "velox-bot@users.noreply.github.com"

          # Another run may have pushed while this one was fetching. Losing that
          # race is NOT a merge: this snapshot is a pure function of what this
          # run read from the source, not a patch on top of someone else's
          # snapshot. Rebasing generated data hits `CONFLICT (add/add)` the first
          # time two runs create the same brand-new data/<week>/ directory --
          # which is how the 2026-08-24 run died holding a finished snapshot.
          # Re-apply this run's own output on the new tip instead. The run that
          # finishes last wins, because it read the source last.
          generated=$(mktemp -d)
          cp -R data cache "$generated"/

          for attempt in 1 2 3; do
            git add data cache
            if git diff --staged --quiet; then
              echo "no change to publish"
              exit 0
            fi
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected, re-applying this run's output (attempt $attempt)"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            # Copy INTO the trees rather than replacing them: only the week this
            # run generated may be overwritten. Older weeks (data/2026-W34, ...)
            # and anything outside data/ that landed meanwhile must survive.
            mkdir -p data cache
            cp -R "$generated"/data/. data/
            cp -R "$generated"/cache/. cache/
          done
          echo "could not push after 3 attempts"
          exit 1
